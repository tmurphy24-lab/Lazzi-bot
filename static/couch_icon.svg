<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Couch">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/><stop offset="1" stop-color="#151d2b"/>
    </linearGradient>
    <linearGradient id="cw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb457"/><stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#cg)"/>
  <!-- couch back -->
  <rect x="9" y="20" width="46" height="18" rx="7" fill="url(#cw)"/>
  <!-- arms -->
  <rect x="5" y="30" width="10" height="17" rx="5" fill="#ff9640"/>
  <rect x="49" y="30" width="10" height="17" rx="5" fill="#ff9640"/>
  <!-- seat -->
  <rect x="11" y="36" width="42" height="12" rx="5" fill="#ffc978"/>
  <!-- legs -->
  <rect x="15" y="47" width="6" height="7" rx="2.5" fill="#121a26"/>
  <rect x="43" y="47" width="6" height="7" rx="2.5" fill="#121a26"/>
  <!-- bot head -->
  <rect x="21" y="9" width="22" height="18" rx="8" fill="#8fe3bd"/>
  <circle cx="28" cy="18" r="3.1" fill="#14202e"/>
  <circle cx="36" cy="18" r="3.1" fill="#14202e"/>
  <circle cx="29.1" cy="16.9" r="1" fill="#fff"/>
  <circle cx="37.1" cy="16.9" r="1" fill="#fff"/>
  <path d="M28 23.4q4 2.4 8 0" stroke="#14202e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M32 9V5" stroke="#8fe3bd" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="2.6" fill="#ffd76a"/>
</svg>
