<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Couch - Applied Jobs History</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#0a0e16">
    <style>
        /* The Couch palette - same tokens as the control panel. */
        :root {
            --bg: #0a0e16;
            --card: #161f2e;
            --card-2: #1c2637;
            --card-3: #232f44;
            --ink: #eef2f8;
            --ink-2: #c3cede;
            --muted: #8595ad;
            --faint: #5d6b83;
            --line: #26324a;
            --line-2: #33415e;
            --brand: #ff9640;
            --brand-2: #ffb457;
            --grad-brand: linear-gradient(135deg, #ffb457, #ff7a3d);
            --ok: #48e0a0;
            --danger: #ff7a7a;
            --thead-bg: #232f44;
            --row-alt: rgba(255,255,255,.018);
            --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.7);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            background-image:
                radial-gradient(900px 460px at 12% -8%, rgba(255,150,64,.16), transparent 62%),
                radial-gradient(760px 420px at 92% 4%, rgba(124,92,255,.16), transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(180deg, rgba(22,31,46,.92), rgba(10,14,22,.55));
            border-bottom: 1px solid var(--line);
            padding: 22px 24px 20px;
            backdrop-filter: blur(10px);
        }
        .brandline { display: flex; align-items: center; gap: 14px; }
        .brandmark {
            width: 50px; height: 50px; flex: none; border-radius: 15px;
            box-shadow: 0 0 0 1px rgba(255,150,64,.35), 0 10px 30px -8px rgba(255,122,61,.45);
        }
        header h1 {
            margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.5px;
            background: linear-gradient(100deg, #fff 8%, var(--brand-2) 55%, #b39dff 96%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        header p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
        .backlink {
            display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
            font-size: 12.5px; font-weight: 700; color: var(--brand-2); text-decoration: none;
            background: var(--card-2); border: 1px solid var(--line-2);
            border-radius: 99px; padding: 6px 14px; transition: border-color .15s, background .15s;
        }
        .backlink:hover { border-color: var(--brand); background: var(--card-3); }
        .wrap { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 16px; }
        main.wrap { padding: 24px 16px 40px; }
        .card {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 18px;
        }
        .table-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table.history {
            border-collapse: collapse;
            width: 100%;
            min-width: 720px;
            font-size: 13.5px;
        }
        table.history th, table.history td {
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            color: var(--ink-2);
            text-align: left;
            vertical-align: top;
            white-space: nowrap;
        }
        table.history td.wraps { white-space: normal; }
        table.history th {
            background: var(--thead-bg);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #fff;
            user-select: none;
        }
        table.history { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
        table.history tbody tr { transition: background .13s; }
        table.history tbody tr:hover { background: rgba(255,150,64,.07); }
        table.history tbody tr:last-child td { border-bottom: none; }
        table.history tbody tr:nth-child(even) { background: var(--row-alt); }
        table.history a { color: var(--brand-2); text-decoration: none; font-weight: 600; }
        table.history a:hover { text-decoration: underline; }
        .sort-toggle {
            background: none;
            border: none;
            font: inherit;
            font-weight: 600;
            color: inherit;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .sort-toggle:hover { color: var(--brand-2); }
        .sort-toggle .arrow { font-size: 11px; color: var(--muted); }
        .sort-toggle { text-transform: uppercase; letter-spacing: .5px; font-size: 12px; }
        .sort-toggle:hover .arrow { color: var(--brand-2); }
        .tick {
            color: var(--ok);
            font-weight: 700;
        }
        .center { text-align: center; }
        .placeholder-row td {
            white-space: normal;
            text-align: center;
            color: var(--muted);
            padding: 28px 12px;
        }
        .placeholder-row.error td { color: var(--danger); }
        .hint {
            margin: 10px 2px 0;
            color: var(--muted);
            font-size: 12.5px;
        }

        @media (max-width: 640px) {
            header { padding: 16px 16px; }
            header h1 { font-size: 18px; }
            .wrap { padding: 0 12px; }
            main.wrap { padding: 18px 12px 32px; }
            .card { padding: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="brandline">
                <img class="brandmark" src="/favicon.svg" alt="" width="50" height="50">
                <div>
                    <h1>Applied Jobs</h1>
                    <p>Every job Lazii-Bot has applied to (or queued for you to apply to), in one place.</p>
                </div>
            </div>
            <a class="backlink" href="/">&#8592; Back to the command center</a>
        </div>
    </header>

    <main class="wrap">
        <div class="card">
            <div class="table-scroll">
                <table class="history">
                    <thead>
                        <tr>
                            <th class="center" style="width:44px;">#</th>
                            <th>Job Title</th>
                            <th>Company</th>
                            <th>HR Contact</th>
                            <th>
                                <button type="button" class="sort-toggle" id="appSortBtn" aria-label="Sort by Application">
                                    Application <span class="arrow" id="appSortArrow">&#8645;</span>
                                </button>
                            </th>
                            <th class="center">Applied</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr class="placeholder-row"><td colspan="6">Loading applied jobs...</td></tr>
                    </tbody>
                </table>
            </div>
            <p class="hint" id="rowCountHint"></p>
        </div>
    </main>

    <script>
        (function () {
            'use strict';

            var jobs = [];               // raw data from the server
            var sortDirection = null;    // null = server order, 'asc' or 'desc' once toggled
            var tbody = document.getElementById('historyBody');
            var sortBtn = document.getElementById('appSortBtn');
            var sortArrow = document.getElementById('appSortArrow');
            var rowCountHint = document.getElementById('rowCountHint');

            function makeCell(tag, opts) {
                var node = document.createElement(tag);
                opts = opts || {};
                if (opts.className) node.className = opts.className;
                if (opts.text !== undefined) node.textContent = opts.text;
                if (opts.center) node.classList.add('center');
                return node;
            }

            function makeLink(href, label, extraClass) {
                var a = document.createElement('a');
                a.href = href;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = label;
                if (extraClass) a.className = extraClass;
                return a;
            }

            function hasHrContact(job) {
                return !!(job.HR_Name && job.HR_Name !== 'Unknown');
            }

            // 0 = Easy Applied, 1 = external link available, 2 = nothing to show
            function applicationRank(job) {
                if (job.External_Job_link === 'Easy Applied') return 0;
                if (job.External_Job_link) return 1;
                return 2;
            }

            function isAppliedAlready(job) {
                return !!(job.Date_Applied && job.Date_Applied !== 'Pending');
            }

            function buildAppliedCell(job) {
                var td = makeCell('td', { center: true });
                if (isAppliedAlready(job)) {
                    var span = document.createElement('span');
                    span.className = 'tick';
                    span.setAttribute('aria-label', 'Applied');
                    span.textContent = '✓';
                    td.appendChild(span);
                }
                return td;
            }

            function markRowApplied(jobId) {
                var row = tbody.querySelector('tr[data-job-id="' + CSS.escape(String(jobId)) + '"]');
                var record = jobs.filter(function (j) { return String(j.Job_ID) === String(jobId); })[0];
                if (record) record.Date_Applied = new Date().toISOString();
                if (!row) return;
                var appliedCell = row.querySelector('.applied-cell');
                if (!appliedCell) return;
                appliedCell.innerHTML = '';
                var span = document.createElement('span');
                span.className = 'tick';
                span.setAttribute('aria-label', 'Applied');
                span.textContent = '✓';
                appliedCell.appendChild(span);
            }

            function buildApplicationCell(job) {
                var td = document.createElement('td');
                if (job.External_Job_link === 'Easy Applied') {
                    td.textContent = 'Easy Applied';
                    return td;
                }
                if (job.External_Job_link) {
                    var link = makeLink(job.External_Job_link, 'External link');
                    link.addEventListener('click', function () {
                        fetch('/applied-jobs/' + encodeURIComponent(job.Job_ID), { method: 'PUT' })
                            .then(function (resp) {
                                if (resp.ok) markRowApplied(job.Job_ID);
                            })
                            .catch(function (err) {
                                console.error('Could not mark job as applied:', err);
                            });
                    });
                    td.appendChild(link);
                    return td;
                }
                td.textContent = 'N/A';
                return td;
            }

            function buildRow(job, rowNumber) {
                var tr = document.createElement('tr');
                tr.setAttribute('data-job-id', job.Job_ID);

                tr.appendChild(makeCell('td', { center: true, text: String(rowNumber) }));

                var titleCell = document.createElement('td');
                titleCell.classList.add('wraps');
                if (job.Job_Link) {
                    titleCell.appendChild(makeLink(job.Job_Link, job.Title || '(untitled)'));
                } else {
                    titleCell.textContent = job.Title || '(untitled)';
                }
                tr.appendChild(titleCell);

                var companyCell = makeCell('td', { text: job.Company || '' });
                companyCell.classList.add('wraps');
                tr.appendChild(companyCell);

                var hrCell = document.createElement('td');
                if (hasHrContact(job) && job.HR_Link) {
                    hrCell.appendChild(makeLink(job.HR_Link, job.HR_Name));
                } else if (hasHrContact(job)) {
                    hrCell.textContent = job.HR_Name;
                } else {
                    hrCell.textContent = 'N/A';
                }
                tr.appendChild(hrCell);

                tr.appendChild(buildApplicationCell(job));

                var appliedCell = buildAppliedCell(job);
                appliedCell.classList.add('applied-cell');
                tr.appendChild(appliedCell);

                return tr;
            }

            function currentOrder() {
                if (!sortDirection) return jobs.slice();
                var withIndex = jobs.map(function (job, i) { return { job: job, i: i }; });
                withIndex.sort(function (a, b) {
                    var ra = applicationRank(a.job), rb = applicationRank(b.job);
                    if (ra !== rb) return sortDirection === 'asc' ? ra - rb : rb - ra;
                    return a.i - b.i;
                });
                return withIndex.map(function (entry) { return entry.job; });
            }

            function showPlaceholder(message, isError) {
                tbody.innerHTML = '';
                var tr = document.createElement('tr');
                tr.className = 'placeholder-row' + (isError ? ' error' : '');
                var td = document.createElement('td');
                td.colSpan = 6;
                td.textContent = message;
                tr.appendChild(td);
                tbody.appendChild(tr);
                rowCountHint.textContent = '';
            }

            function render() {
                if (!jobs.length) {
                    showPlaceholder('No applied jobs yet. Run the bot to start building your history.', false);
                    return;
                }
                tbody.innerHTML = '';
                var ordered = currentOrder();
                ordered.forEach(function (job, idx) {
                    tbody.appendChild(buildRow(job, idx + 1));
                });
                rowCountHint.textContent = ordered.length + (ordered.length === 1 ? ' job.' : ' jobs.');
            }

            function toggleSort() {
                if (sortDirection === 'asc') {
                    sortDirection = 'desc';
                    sortArrow.textContent = '↓';
                } else {
                    sortDirection = 'asc';
                    sortArrow.textContent = '↑';
                }
                render();
            }

            sortBtn.addEventListener('click', toggleSort);

            fetch('/applied-jobs')
                .then(function (resp) {
                    return resp.json().then(function (body) {
                        return { ok: resp.ok, status: resp.status, body: body };
                    });
                })
                .then(function (res) {
                    if (!res.ok || !Array.isArray(res.body)) {
                        // The server says "no history yet" once there have been
                        // no runs - that is a quiet empty state, not a failure.
                        showPlaceholder('No applications yet. They show up here after Lazii-Bot\'s first run.', false);
                        return;
                    }
                    jobs = res.body;
                    render();
                })
                .catch(function (err) {
                    console.error('Failed to load applied jobs:', err);
                    showPlaceholder('Could not load applied jobs. Make sure the app is running and try refreshing this page.', true);
                });
        })();
    </script>
    <script src="/static/lazii_overlay.js" defer></script>
</body>
</html>
