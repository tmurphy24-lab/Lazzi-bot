  Local control panel for the Auto Job Applier. Vanilla HTML/CSS/JS only, no
  external libraries or network calls, works fully offline. It reads and writes
  only user_config.json (via the API in app.py) and never edits the config/*.py
  files.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Couch - Job Command Center</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#0a0e16">
    <style>
        /* ===================================================================
           The Couch - design system
           Midnight lounge base, warm amber "couch" primary, mint for go,
           violet for insight. One token set, used by every tab.
           =================================================================== */
        :root {
            --bg: #0a0e16;
            --bg-2: #0f1522;
            --card: #161f2e;
            --card-2: #1c2637;
            --card-3: #232f44;
            --ink: #eef2f8;
            --ink-2: #c3cede;
            --muted: #8595ad;
            --faint: #5d6b83;
            --line: #26324a;
            --line-2: #33415e;

            --brand: #ff9640;
            --brand-2: #ffb457;
            --brand-dark: #f07a20;
            --brand-ink: #1a1206;
            --grad-brand: linear-gradient(135deg, #ffb457, #ff7a3d);
            --grad-mint: linear-gradient(135deg, #8fe3bd, #35c98c);
            --grad-violet: linear-gradient(135deg, #b39dff, #7c5cff);
            --grad-blue: linear-gradient(135deg, #7fb6ff, #4f8cff);

            --ok: #48e0a0;
            --info: #6fa8ff;
            --violet: #a78bfa;
            --warn: #ffc95c;
            --danger: #ff7a7a;

            --glow-brand: 0 0 0 1px rgba(255,150,64,.35), 0 10px 30px -8px rgba(255,122,61,.45);
            --glow-mint: 0 0 0 1px rgba(72,224,160,.3), 0 10px 30px -10px rgba(72,224,160,.35);
            --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.7);
            --shadow-lg: 0 20px 55px -20px rgba(0,0,0,.85);
            --r-sm: 9px; --r: 14px; --r-lg: 20px;
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: "Segoe UI Variable Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.55;
            /* Two lamp-glows behind everything, so the page never reads flat. */
            background-image:
                radial-gradient(900px 460px at 12% -8%, rgba(255,150,64,.16), transparent 62%),
                radial-gradient(760px 420px at 92% 4%, rgba(124,92,255,.16), transparent 60%),
                radial-gradient(1000px 600px at 50% 108%, rgba(72,224,160,.09), transparent 66%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        ::selection { background: rgba(255,150,64,.32); }
        ::-webkit-scrollbar { width: 11px; height: 11px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background: #46567a; background-clip: content-box; }

        /* ---- header / brand ---- */
        header {
            background: linear-gradient(180deg, rgba(22,31,46,.92), rgba(10,14,22,.55));
            border-bottom: 1px solid var(--line);
            padding: 22px 24px 20px;
            backdrop-filter: blur(10px);
        }
        .brandline { display: flex; align-items: center; gap: 14px; }
        .brandmark {
            width: 54px; height: 54px; flex: none; border-radius: 16px;
            box-shadow: var(--glow-brand);
            animation: float 5s ease-in-out infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
        header h1 {
            margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -.6px;
            background: linear-gradient(100deg, #fff 8%, var(--brand-2) 52%, #b39dff 96%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        header .tagline { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; max-width: 78ch; }
        .badgerow { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
        .badge {
            font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
            padding: 4px 10px; border-radius: 99px;
            background: var(--card-2); border: 1px solid var(--line-2); color: var(--muted);
        }
        .badge.live { color: var(--ok); border-color: rgba(72,224,160,.4); background: rgba(72,224,160,.1); }
        .badge.brandy { color: var(--brand-2); border-color: rgba(255,150,64,.4); background: rgba(255,150,64,.1); }

        .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }

        /* ---- tabs ---- */
        nav {
            display: flex; flex-wrap: wrap; gap: 6px;
            background: rgba(10,14,22,.82);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            position: sticky; top: 0; z-index: 5;
            padding: 10px 20px;
        }
        nav button {
            display: inline-flex; align-items: center; gap: 7px;
            background: transparent; border: 1px solid transparent;
            border-radius: 99px; padding: 8px 15px;
            font-size: 13.5px; font-weight: 650; color: var(--muted);
            font-family: inherit;
            cursor: pointer; white-space: nowrap;
            transition: color .16s, background .16s, border-color .16s, transform .16s;
        }
        nav button svg { width: 15px; height: 15px; flex: none; opacity: .9; }
        nav button:hover { color: var(--ink); background: var(--card-2); border-color: var(--line); transform: translateY(-1px); }
        nav button.active {
            color: var(--brand-ink); background: var(--grad-brand);
            border-color: transparent; box-shadow: var(--glow-brand);
        }
        nav button.active svg { opacity: 1; }

        main.wrap { padding: 26px 20px 160px; }
        .panel { display: none; }
        .panel.active { display: block; animation: rise .28s cubic-bezier(.2,.8,.3,1); }
        @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

        /* ---- panel headings ---- */
        .panel > h2, .panel h2.section-h {
            font-size: 19px; font-weight: 800; letter-spacing: -.3px;
            margin: 2px 0 4px; color: #fff;
        }
        .couch-sub { color: var(--muted); margin: 0 0 20px; font-size: 13.5px; max-width: 82ch; }

        /* ---- fields ---- */
        .field {
            position: relative;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 15px 17px;
            margin-bottom: 11px;
            box-shadow: var(--shadow);
            transition: border-color .16s, transform .16s, box-shadow .16s;
        }
        .field::before {
            content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
            border-radius: 0 3px 3px 0; background: var(--grad-brand);
            opacity: 0; transition: opacity .18s;
        }
        .field:focus-within { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
        .field:focus-within::before { opacity: 1; }
        .field label { display: block; font-weight: 700; margin-bottom: 3px; font-size: 13.5px; color: var(--ink); }
        .field .help { color: var(--muted); font-size: 12.5px; margin: 0 0 9px; }
        .field input[type=text],
        .field input[type=password],
        .field input[type=number],
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line-2);
            border-radius: var(--r-sm);
            font-size: 13.5px;
            font-family: inherit;
            background: var(--bg-2);
            color: var(--ink);
            transition: border-color .15s, box-shadow .15s, background .15s;
        }
        .field select option { background: var(--card); color: var(--ink); }
        .field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--brand);
            background: var(--card);
            box-shadow: 0 0 0 3px rgba(255,150,64,.18);
        }
        .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
        .checkline { display: flex; align-items: center; gap: 11px; }
        .checkline input[type=checkbox] { width: 20px; height: 20px; flex: none; accent-color: var(--brand); cursor: pointer; }
        .checkline label { margin: 0; cursor: pointer; }
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 46px; }
        .pw-eye {
            position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            background: none; border: none; padding: 6px; margin: 0;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--muted); cursor: pointer; border-radius: 7px;
        }
        .pw-eye:hover { color: var(--brand-2); background: var(--card-3); }
        .pw-eye svg { display: block; }
        .field.disabled { opacity: .45; }
        .field.disabled input, .field.disabled select,
        .field.disabled textarea, .field.disabled .pw-eye { cursor: not-allowed; }

        details.advanced { margin: 6px 0 12px; }
        details.advanced > summary {
            cursor: pointer; user-select: none; list-style: none;
            font-weight: 700; font-size: 13.5px; color: var(--brand-2);
            padding: 12px 15px; background: var(--card);
            border: 1px dashed var(--line-2); border-radius: var(--r);
        }
        details.advanced > summary::-webkit-details-marker { display: none; }
        details.advanced > summary::before { content: "\25B8\00a0\00a0"; }
        details.advanced[open] > summary::before { content: "\25BE\00a0\00a0"; }
        details.advanced > summary:hover { background: var(--card-2); border-color: var(--brand); }
        details.advanced > .adv-body { padding-top: 12px; }

        /* ---- save bar ---- */
        .savebar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15,21,34,.9);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--line);
            padding: 13px 20px;
            display: flex; align-items: center; gap: 14px; justify-content: flex-end;
            box-shadow: 0 -10px 40px -18px rgba(0,0,0,.9);
            z-index: 6;
        }
        /* Right padding keeps Save clear of the Lazii-Bot bubble parked in the
           bottom-right corner of every page. */
        .savebar .inner { width: 100%; max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-right: 92px; }
        .savebar .msg { margin-right: auto; font-size: 13.5px; color: var(--muted); }
        .savebar .msg.ok { color: var(--ok); }
        .savebar .msg.err { color: var(--danger); }

        /* ---- buttons ---- */
        button.btn, .couch-btn {
            background: var(--grad-brand); color: var(--brand-ink);
            border: none; border-radius: 11px;
            padding: 10px 20px; font-size: 13.5px; font-weight: 750;
            font-family: inherit; cursor: pointer;
            box-shadow: 0 6px 18px -8px rgba(255,122,61,.8);
            transition: transform .14s, filter .14s, box-shadow .14s;
        }
        button.btn:hover, .couch-btn:hover { transform: translateY(-1px); filter: brightness(1.07); box-shadow: 0 10px 24px -8px rgba(255,122,61,.9); }
        button.btn:active, .couch-btn:active { transform: translateY(0); }
        button.btn:disabled, .couch-btn:disabled { background: var(--card-3); color: var(--faint); box-shadow: none; cursor: not-allowed; transform: none; filter: none; }
        button.btn.secondary, .couch-btn.ghost {
            background: var(--card-2); color: var(--ink-2);
            border: 1px solid var(--line-2); box-shadow: none;
        }
        button.btn.secondary:hover, .couch-btn.ghost:hover { background: var(--card-3); color: #fff; border-color: var(--brand); }
        button.btn.danger { background: linear-gradient(135deg, #ff9a9a, #e8484d); color: #2a0a0b; box-shadow: 0 6px 18px -8px rgba(232,72,77,.8); }
        button.btn.go { background: var(--grad-mint); color: #05261a; box-shadow: 0 6px 18px -8px rgba(53,201,140,.8); }

        /* ---- notes ---- */
        .note {
            background: linear-gradient(135deg, rgba(111,168,255,.12), rgba(124,92,255,.08));
            border: 1px solid rgba(111,168,255,.3);
            color: #cfe0ff;
            border-radius: var(--r);
            padding: 14px 17px; font-size: 13.5px; margin-bottom: 18px;
        }
        .note b, .note strong { color: #fff; }

        /* ---- run tab ---- */
        .runbox {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 18px; margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .status-line { display: flex; align-items: center; gap: 11px; margin-bottom: 15px; font-weight: 700; font-size: 14.5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--faint); flex: none; }
        .dot.on { background: var(--ok); animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(72,224,160,.55) }
            70% { box-shadow: 0 0 0 10px rgba(72,224,160,0) }
        }
        .run-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        pre.log {
            background: #060a11;
            color: #cfe0d8;
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 15px;
            font-family: ui-monospace, "Cascadia Code", SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px; line-height: 1.6;
            max-height: 380px; overflow: auto;
            white-space: pre-wrap; word-break: break-word; margin: 0;
        }

        /* ---- tables ---- */
        table.jobs {
            border-collapse: separate; border-spacing: 0;
            width: 100%; font-size: 13px;
            background: var(--card); border: 1px solid var(--line);
            border-radius: var(--r); overflow: hidden;
        }
        table.jobs th, table.jobs td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; color: var(--ink-2); }
        table.jobs th { background: var(--card-3); font-weight: 700; color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
        table.jobs tbody tr { transition: background .13s; }
        table.jobs tbody tr:nth-child(even) { background: rgba(255,255,255,.018); }
        table.jobs tbody tr:hover { background: rgba(255,150,64,.07); }
        table.jobs tbody tr:last-child td { border-bottom: none; }
        table.jobs a { color: var(--brand-2); text-decoration: none; font-weight: 600; }
        table.jobs a:hover { text-decoration: underline; }
        .tick { color: var(--ok); font-weight: 800; }
        .muted-small { color: var(--muted); font-size: 13px; }

        /* ---- couch surfaces (all custom tabs) ---- */
        .panel.couch { background: none; border: none; padding: 0; }
        .panel.couch h2 { color: #fff; margin: 0 0 5px; font-size: 19px; }
        .couch-banner {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, rgba(255,150,64,.16), rgba(124,92,255,.14) 55%, rgba(22,31,46,.9));
            border: 1px solid var(--line-2); border-radius: var(--r-lg);
            padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow);
        }
        .couch-banner::after {
            content: ""; position: absolute; right: -60px; top: -70px;
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,180,87,.28), transparent 68%);
            pointer-events: none;
        }
        .couch-banner h2 { font-size: 23px; margin: 0 0 6px; color: #fff; letter-spacing: -.4px; }
        .couch-banner p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 74ch; }

        .couch-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 13px; margin-bottom: 20px; }
        .couch-card {
            position: relative; overflow: hidden;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line); border-radius: var(--r);
            padding: 16px 17px; cursor: pointer;
            transition: transform .16s, border-color .16s, box-shadow .16s;
        }
        .couch-card:hover { transform: translateY(-3px); border-color: var(--brand); box-shadow: var(--shadow-lg); }
        .couch-card.picked { border-color: var(--ok); box-shadow: var(--glow-mint); }
        .couch-card.picked::after {
            content: "\2713"; position: absolute; top: 11px; right: 13px;
            color: var(--ok); font-weight: 800; font-size: 15px;
        }
        .couch-card h3 { margin: 0 0 6px; font-size: 15px; color: #fff; font-weight: 750; }
        .couch-card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.5; }

        .couch-quick {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line); border-radius: var(--r-lg);
            padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
        }
        .couch-quick label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
        .couch-quick > *:first-child label { margin-top: 0; }
        .couch-quick input[type=text], .couch-quick input[type=number], .couch-quick select, .couch-quick textarea {
            width: 100%; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line-2);
            background: var(--bg-2); color: var(--ink); font-size: 13.5px; font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .couch-quick input:focus, .couch-quick select:focus, .couch-quick textarea:focus {
            outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,150,64,.18);
        }
        .couch-quick select option { background: var(--card); }
        .couch-quick .checkline { margin-top: 14px; }
        .couch-quick .checkline label { margin: 0; color: var(--ink); font-size: 13.5px; text-transform: none; letter-spacing: 0; }
        .couch-quick .checkline input { accent-color: var(--brand); }

        .couch-actions { display: flex; gap: 11px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
        .couch-msg { font-size: 12.5px; color: var(--ok); }
        .couch-msg.bad { color: var(--danger); }
        .couch-spin { color: var(--muted); font-size: 13px; }

        .couch-step {
            display: flex; gap: 13px;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line); border-radius: var(--r);
            padding: 14px 16px; margin-bottom: 10px;
            transition: border-color .15s, transform .15s;
        }
        .couch-step:hover { border-color: var(--line-2); transform: translateX(3px); }
        .couch-step .num {
            flex: none; width: 30px; height: 30px; border-radius: 50%;
            background: var(--grad-brand); color: var(--brand-ink); font-weight: 800;
            display: flex; align-items: center; justify-content: center; font-size: 13.5px;
        }
        .couch-step h3 { margin: 0 0 4px; font-size: 14.5px; color: #fff; }
        .couch-step p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
        .couch-foot { font-size: 12px; color: var(--faint); margin-top: 16px; }

        /* ---- stat tiles ---- */
        .couch-stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 13px; margin-bottom: 20px; }
        .couch-stat {
            position: relative; overflow: hidden;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line); border-radius: var(--r);
            padding: 16px 17px;
            transition: transform .16s, border-color .16s;
        }
        .couch-stat:hover { transform: translateY(-2px); border-color: var(--line-2); }
        .couch-stat::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--grad-brand); }
        .couch-stat:nth-child(2)::before { background: var(--grad-mint); }
        .couch-stat:nth-child(3)::before { background: var(--grad-blue); }
        .couch-stat:nth-child(4)::before { background: var(--grad-violet); }
        .couch-stat .val { font-size: 30px; font-weight: 850; color: #fff; letter-spacing: -1px; line-height: 1.1; }
        .couch-stat .lab { font-size: 11.5px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: .6px; font-weight: 650; }

        .couch-bars-wrap { margin-bottom: 38px; }
        .couch-bars {
            display: flex; align-items: flex-end; gap: 5px; height: 140px;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
        }
        .couch-bars .bar {
            flex: 1; background: linear-gradient(180deg, var(--brand-2), rgba(255,122,61,.25));
            border-radius: 4px 4px 0 0; min-height: 3px; position: relative;
            transition: filter .15s, transform .15s;
        }
        .couch-bars .bar:hover { filter: brightness(1.25); transform: scaleY(1.03); }
        .couch-bars .bar span { position: absolute; bottom: -19px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--faint); white-space: nowrap; }

        .couch-boardline {
            display: inline-flex; align-items: center; gap: 7px; margin: 0 8px 8px 0;
            font-size: 13px; color: var(--ink-2); cursor: pointer;
            background: var(--card-2); border: 1px solid var(--line-2);
            border-radius: 99px; padding: 6px 13px 6px 10px;
            text-transform: capitalize; transition: border-color .15s, background .15s;
        }
        .couch-boardline:hover { border-color: var(--brand); background: var(--card-3); }
        /* Board pills sit inside .couch-quick, whose generic label rule would
           otherwise stretch them into full-width uppercase bars. */
        .couch-quick label.couch-boardline {
            display: inline-flex; width: auto; margin: 0 8px 8px 0;
            font-size: 13px; font-weight: 650; text-transform: capitalize;
            letter-spacing: 0; color: var(--ink-2); padding: 6px 14px 6px 11px;
        }
        .couch-quick label.couch-boardline input { width: 15px; height: 15px; margin: 0; }
        .couch-boardline input { accent-color: var(--brand); width: 15px; height: 15px; cursor: pointer; }

        /* ---- pipeline board ---- */
        .pipe-board {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 13px; align-items: start;
        }
        .pipe-col {
            background: linear-gradient(180deg, rgba(28,38,55,.75), rgba(22,31,46,.6));
            border: 1px solid var(--line); border-radius: var(--r);
            padding: 12px; min-height: 120px;
        }
        .pipe-col h3 {
            display: flex; align-items: center; gap: 8px;
            margin: 0 0 11px; font-size: 12px; text-transform: uppercase;
            letter-spacing: .8px; color: var(--muted); font-weight: 750;
        }
        .pipe-col h3 .cnt {
            margin-left: auto; background: var(--card-3); color: var(--ink-2);
            border-radius: 99px; padding: 1px 9px; font-size: 11.5px; letter-spacing: 0;
        }
        .pipe-col .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .pipe-card {
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid var(--line-2); border-left-width: 3px;
            border-radius: 11px; padding: 11px 12px; margin-bottom: 9px;
            transition: transform .14s, box-shadow .14s, border-color .14s;
        }
        .pipe-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .pipe-card h4 { margin: 0 0 3px; font-size: 13.5px; color: #fff; font-weight: 700; line-height: 1.35; }
        .pipe-card .co { font-size: 12.5px; color: var(--brand-2); font-weight: 650; }
        .pipe-card .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
        .pipe-card .row { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
        .pipe-card select {
            flex: 1; font-size: 11.5px; padding: 5px 7px; border-radius: 7px;
            background: var(--bg-2); color: var(--ink); border: 1px solid var(--line-2); font-family: inherit;
        }
        .pipe-card .mini {
            background: var(--card-3); border: 1px solid var(--line-2); color: var(--muted);
            border-radius: 7px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; font-family: inherit;
            transition: color .14s, border-color .14s;
        }
        .pipe-card .mini:hover { color: #fff; border-color: var(--brand); }
        .pipe-card .mini.del:hover { color: var(--danger); border-color: var(--danger); }
        .pipe-empty { color: var(--faint); font-size: 12px; text-align: center; padding: 14px 4px; font-style: italic; }
        .src-tag {
            display: inline-block; font-size: 10.5px; font-weight: 750; letter-spacing: .4px;
            text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
            background: var(--card-3); color: var(--muted); border: 1px solid var(--line-2);
        }
        .src-tag.indeed, .src-tag.linkedin { color: #7fb6ff; border-color: rgba(111,168,255,.4); background: rgba(111,168,255,.12); }
        .src-tag.ziprecruiter, .src-tag.glassdoor { color: #8fe3bd; border-color: rgba(72,224,160,.4); background: rgba(72,224,160,.12); }
        .src-tag.google { color: #ffc95c; border-color: rgba(255,201,92,.4); background: rgba(255,201,92,.12); }
        .savebtn {
            background: var(--card-3); border: 1px solid var(--line-2); color: var(--brand-2);
            border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 700;
            cursor: pointer; font-family: inherit; white-space: nowrap;
            transition: background .14s, color .14s, border-color .14s;
        }
        .savebtn:hover { background: var(--grad-brand); color: var(--brand-ink); border-color: transparent; }
        .savebtn.done { background: rgba(72,224,160,.14); color: var(--ok); border-color: rgba(72,224,160,.4); cursor: default; }
        .dupe-tag {
            display: inline-block; margin-right: 6px; font-size: 10.5px; font-weight: 750;
            text-transform: uppercase; letter-spacing: .4px; padding: 2px 7px; border-radius: 5px;
            background: rgba(255,201,92,.14); color: var(--warn);
            border: 1px solid rgba(255,201,92,.4); cursor: help;
        }
        .note-wrap { margin-top: 8px; }
        .note-toggle { width: 100%; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-toggle.has-note { color: var(--ink-2); border-color: var(--line-2); }
        .note-area {
            width: 100%; margin-top: 6px; padding: 8px 9px; font-size: 12px; line-height: 1.45;
            font-family: inherit; resize: vertical;
            background: var(--bg-2); color: var(--ink);
            border: 1px solid var(--line-2); border-radius: 8px;
        }
        .note-area:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,150,64,.18); }

        /* ---- responsive ---- */
        @media (max-width: 700px) {
            header { padding: 16px 16px 14px; }
            header h1 { font-size: 21px; }
            .brandmark { width: 42px; height: 42px; }
            .wrap { padding: 0 13px; }
            nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 9px 13px; }
            nav::-webkit-scrollbar { height: 0; }
            nav button { padding: 7px 12px; font-size: 12.5px; }
            main.wrap { padding: 20px 13px 190px; }
            .savebar { padding: 11px 13px; }
            .savebar .inner { flex-wrap: wrap; gap: 9px; padding-right: 0; }
            .savebar .msg { flex-basis: 100%; margin: 0; }
            .savebar .btn { flex: 1 1 auto; }
            .couch-stat .val { font-size: 25px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <div class="brandline">
                <img class="brandmark" src="/favicon.svg" alt="" width="54" height="54">
                <div>
                    <h1>The Couch</h1>
                    <p class="tagline">Drop your info on the cushions and Lazii-Bot does the job hunting - scouting boards, tracking the pipeline, and applying while you sit back.</p>
                </div>
            </div>
            <div class="badgerow">
                <span class="badge brandy">Lazii-Bot</span>
                <span class="badge">100% local</span>
                <span class="badge">Nothing uploaded</span>
                <span class="badge live" id="hdrStatus">Idle</span>
            </div>
        </div>
    </header>

    <nav id="tabs" class="wrap"></nav>

    <main class="wrap">
        <div id="panels"></div>
    </main>

    <div class="savebar" id="savebar">
        <div class="inner">
            <span class="msg" id="saveMsg">Make your changes across the tabs, then click Save.</span>
            <button class="btn secondary" id="reloadBtn" type="button">Reload</button>
            <button class="btn" id="saveBtn" type="button">Save</button>
        </div>
    </div>

    <script>
        // ---- icons ----
        var EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        var EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        // ---- state ----
        var SCHEMA = [];
        var CONFIG = {};        // {config_module: {key: value}}
        var BASELINE = {};      // JSON snapshot for change detection
        var MODEL_FIELDS = [];  // [{datalistId, models}] for provider-aware model lists
        var activeTab = null;
        var logOffset = 0;
        var pollTimer = null;

        // ---- helpers ----
        function el(tag, attrs, children) {
            var node = document.createElement(tag);
            if (attrs) {
                for (var k in attrs) {
                    if (k === 'text') { node.textContent = attrs[k]; }
                    else if (k === 'html') { node.innerHTML = attrs[k]; }
                    else { node.setAttribute(k, attrs[k]); }
                }
            }
            (children || []).forEach(function (c) { if (c) node.appendChild(c); });
            return node;
        }

        function fieldId(field) { return 'f__' + field.config_module + '__' + field.key; }
        function datalistId(field) { return 'dl__' + field.config_module + '__' + field.key; }

        function currentValue(cm, key) {
            if (CONFIG[cm] && Object.prototype.hasOwnProperty.call(CONFIG[cm], key)) {
                return CONFIG[cm][key];
            }
            return '';
        }

        function asText(value) {
            return (value === null || value === undefined) ? '' : String(value);
        }

        // ---- rendering ----
        function makePasswordControl(id, value) {
            var wrap = el('div', { class: 'pw-wrap' });
            var input = el('input', { type: 'password', id: id });
            input.value = value;
            var btn = el('button', { type: 'button', class: 'pw-eye', 'aria-label': 'Show password', html: EYE_SVG });
            btn.addEventListener('click', function () {
                if (input.disabled) return;
                if (input.type === 'password') {
                    input.type = 'text'; btn.innerHTML = EYE_OFF_SVG; btn.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password'; btn.innerHTML = EYE_SVG; btn.setAttribute('aria-label', 'Show password');
                }
            });
            wrap.appendChild(input);
            wrap.appendChild(btn);
            return wrap;
        }

        function makeModelControl(field, value) {
            var wrap = el('div', {});
            var input = el('input', { type: 'text', id: fieldId(field), list: datalistId(field), autocomplete: 'off' });
            input.value = value;
            var dl = el('datalist', { id: datalistId(field) });
            wrap.appendChild(input);
            wrap.appendChild(dl);
            MODEL_FIELDS.push({ datalistId: datalistId(field), models: field.models_by_provider || {} });
            return wrap;
        }

        function renderControl(field) {
            var value = currentValue(field.config_module, field.key);
            var id = fieldId(field);
            if (field.type === 'bool') {
                var cb = el('input', { type: 'checkbox', id: id });
                if (value === true) cb.checked = true;
                return cb;
            }
            if (field.type === 'textarea') {
                var ta = el('textarea', { id: id });
                ta.value = asText(value);
                return ta;
            }
            if (field.type === 'select') {
                var sel = el('select', { id: id });
                (field.options || []).forEach(function (opt) {
                    var o = el('option', { value: opt, text: opt === '' ? '(leave unanswered)' : opt });
                    if (String(value) === String(opt)) o.selected = true;
                    sel.appendChild(o);
                });
                return sel;
            }
            if (field.type === 'list') {
                var li = el('input', { type: 'text', id: id });
                li.value = Array.isArray(value) ? value.join(', ') : asText(value);
                return li;
            }
            if (field.type === 'number') {
                var nu = el('input', { type: 'number', id: id, step: 'any' });
                nu.value = asText(value);
                return nu;
            }
            if (field.type === 'password') {
                return makePasswordControl(id, asText(value));
            }
            if (field.models_by_provider) {
                return makeModelControl(field, asText(value));
            }
            var t = el('input', { type: 'text', id: id });
            t.value = asText(value);
            return t;
        }

        function renderField(field) {
            var control = renderControl(field);
            var box = el('div', { class: 'field' });
            box.dataset.cm = field.config_module;
            box.dataset.key = field.key;
            if (field.ai) box.dataset.ai = '1';
            if (field.type === 'bool') {
                var line = el('div', { class: 'checkline' });
                line.appendChild(control);
                line.appendChild(el('label', { for: fieldId(field), text: field.label }));
                box.appendChild(line);
                if (field.help) box.appendChild(el('p', { class: 'help', text: field.help }));
            } else {
                box.appendChild(el('label', { for: fieldId(field), text: field.label }));
                if (field.help) box.appendChild(el('p', { class: 'help', text: field.help }));
                box.appendChild(control);
            }
            return box;
        }

        function buildTabs() {
            var tabs = document.getElementById('tabs');
            var panels = document.getElementById('panels');
            tabs.innerHTML = '';
            panels.innerHTML = '';
            MODEL_FIELDS = [];

            SCHEMA.forEach(function (section) {
                var btn = el('button', { type: 'button', text: section.section });
                btn.addEventListener('click', function () { showTab(section.section); });
                btn.dataset.tab = section.section;
                tabs.appendChild(btn);

                var panel = el('div', { class: 'panel' });
                panel.dataset.tab = section.section;

                var common = section.fields.filter(function (f) { return !f.advanced; });
                var advanced = section.fields.filter(function (f) { return f.advanced; });

                common.forEach(function (field) { panel.appendChild(renderField(field)); });

                if (advanced.length) {
                    var det = el('details', { class: 'advanced' });
                    det.appendChild(el('summary', { text: 'Advanced options' }));
                    var body = el('div', { class: 'adv-body' });
                    advanced.forEach(function (field) { body.appendChild(renderField(field)); });
                    det.appendChild(body);
                    panel.appendChild(det);
                }

                panels.appendChild(panel);
            });

            // The Couch: game-selection, scout, stats and guide tabs (not schema).
            var gamesBtn = el('button', { type: 'button', text: 'Games' });
            gamesBtn.dataset.tab = 'Games';
            gamesBtn.addEventListener('click', function () { showTab('Games'); });
            tabs.appendChild(gamesBtn);
            panels.appendChild(buildGamesPanel());

            var scoutBtn = el('button', { type: 'button', text: 'Scout' });
            scoutBtn.dataset.tab = 'Scout';
            scoutBtn.addEventListener('click', function () { showTab('Scout'); });
            tabs.appendChild(scoutBtn);
            panels.appendChild(buildScoutPanel());

            var pipeBtn = el('button', { type: 'button', text: 'Pipeline' });
            pipeBtn.dataset.tab = 'Pipeline';
            pipeBtn.addEventListener('click', function () { showTab('Pipeline'); });
            tabs.appendChild(pipeBtn);
            panels.appendChild(buildPipelinePanel());

            var statsBtn = el('button', { type: 'button', text: 'Stats' });
            statsBtn.dataset.tab = 'Stats';
            statsBtn.addEventListener('click', function () { showTab('Stats'); });
            tabs.appendChild(statsBtn);
            panels.appendChild(buildStatsPanel());

            var guideBtn = el('button', { type: 'button', text: 'Guide' });
            guideBtn.dataset.tab = 'Guide';
            guideBtn.addEventListener('click', function () { showTab('Guide'); });
            tabs.appendChild(guideBtn);
            panels.appendChild(buildGuidePanel());

            // Extra "Run" tab (not part of the config schema).
            var runBtn = el('button', { type: 'button', text: 'Run' });
            runBtn.dataset.tab = 'Run';
            runBtn.addEventListener('click', function () { showTab('Run'); });
            tabs.appendChild(runBtn);
            panels.appendChild(buildRunPanel());

            decorateTabs();
            wireAi();
            updateModelLists();
            applyAiState();

            var firstUser = (CONFIG.secrets && CONFIG.secrets.username) || '';
            var freshSetup = !firstUser || firstUser === 'username@example.com';
            showTab(freshSetup ? 'Guide' : (SCHEMA.length ? SCHEMA[0].section : 'Run'));
        }

        function showTab(name) {
            activeTab = name;
            document.querySelectorAll('#tabs button').forEach(function (b) {
                b.classList.toggle('active', b.dataset.tab === name);
            });
            document.querySelectorAll('#panels .panel').forEach(function (p) {
                p.classList.toggle('active', p.dataset.tab === name);
            });
            var hideBar = (name === 'Run' || name === 'Games' || name === 'Guide'
                || name === 'Scout' || name === 'Stats' || name === 'Pipeline');
            document.getElementById('savebar').style.display = hideBar ? 'none' : 'flex';
            if (name === 'Run') { refreshStatus(); refreshLogs(); loadAppliedJobs(); }
            if (name === 'Stats') { refreshStats(); }
            if (name === 'Pipeline') { refreshPipeline(); }
        }

        // ---- AI master switch + model lists ----
        function useAiEnabled() {
            var cb = document.getElementById('f__secrets__use_AI');
            return cb ? cb.checked : false;
        }

        function applyAiState() {
            var enabled = useAiEnabled();
            document.querySelectorAll('.field[data-ai="1"]').forEach(function (box) {
                box.classList.toggle('disabled', !enabled);
                box.querySelectorAll('input, select, textarea, button').forEach(function (ctrl) {
                    ctrl.disabled = !enabled;
                });
            });
        }

        function currentProvider() {
            var sel = document.getElementById('f__secrets__ai_provider');
            return sel ? sel.value : 'openai';
        }

        function updateModelLists() {
            var prov = currentProvider();
            MODEL_FIELDS.forEach(function (m) {
                var dl = document.getElementById(m.datalistId);
                if (!dl) return;
                dl.innerHTML = '';
                var list = (m.models && m.models[prov]) || [];
                list.forEach(function (name) { dl.appendChild(el('option', { value: name })); });
            });
        }

        function wireAi() {
            var cb = document.getElementById('f__secrets__use_AI');
            if (cb) cb.addEventListener('change', applyAiState);
            var prov = document.getElementById('f__secrets__ai_provider');
            if (prov) prov.addEventListener('change', updateModelLists);
        }

        // ---- Run tab ----
        function buildRunPanel() {
            var panel = el('div', { class: 'panel' });
            panel.dataset.tab = 'Run';

            panel.appendChild(el('div', { class: 'note', html:
                'This runs on <strong>your computer</strong> using <strong>your own LinkedIn account</strong>. ' +
                'When you press Start, a browser window will open - keep it in the foreground and let it work. ' +
                'You can watch progress in the log below and stop at any time.' }));

            var runbox = el('div', { class: 'runbox' });
            var statusLine = el('div', { class: 'status-line' });
            statusLine.appendChild(el('span', { class: 'dot', id: 'statusDot' }));
            statusLine.appendChild(el('span', { id: 'statusText', text: 'Checking status...' }));
            runbox.appendChild(statusLine);

            var actions = el('div', { class: 'run-actions' });
            var startBtn = el('button', { class: 'btn go', id: 'startBtn', type: 'button', text: 'Start hunting' });
            var stopBtn = el('button', { class: 'btn danger', id: 'stopBtn', type: 'button', text: 'Stop' });
            startBtn.addEventListener('click', startBot);
            stopBtn.addEventListener('click', stopBot);
            actions.appendChild(startBtn);
            actions.appendChild(stopBtn);
            runbox.appendChild(actions);
            runbox.appendChild(el('p', { class: 'muted-small',
                text: 'Tip: save your settings on the other tabs before starting.' }));
            panel.appendChild(runbox);

            panel.appendChild(el('h2', { class: 'section-h', text: 'Activity log' }));
            panel.appendChild(el('pre', { class: 'log', id: 'logPane', text: 'No activity yet.' }));

            var histWrap = el('div', {});
            histWrap.appendChild(el('h2', { class: 'section-h', text: 'Applied jobs history' }));
            var refresh = el('button', { class: 'btn secondary', type: 'button', text: 'Refresh history' });
            refresh.addEventListener('click', loadAppliedJobs);
            histWrap.appendChild(refresh);
            var tableHolder = el('div', { id: 'jobsHolder', style: 'overflow-x:auto; margin-top:12px;' });
            tableHolder.appendChild(el('p', { class: 'muted-small', text: 'Loading history...' }));
            histWrap.appendChild(tableHolder);
            panel.appendChild(histWrap);

            return panel;
        }

        // ---- Games tab (game-selection job setup) ----
        var GAMES = [
            { id: 'speedrun', title: 'Speedrun', desc: 'Fresh listings only: Past 24 hours, most recent first, Easy Apply only.', patch: { g_date: 'Past 24 hours', g_easy: true } },
            { id: 'story', title: 'Story Mode', desc: 'A steady week of matches. Past week, most relevant first.', patch: { g_date: 'Past week', g_easy: true } },
            { id: 'remote', title: 'Remote Rampage', desc: 'Work-from-couch jobs: Remote filter, Past week.', patch: { g_date: 'Past week', g_onsite: 'Remote', g_easy: true } },
            { id: 'boss', title: 'Boss Rush', desc: 'Aim higher: Mid-Senior level roles, $100,000+ salary filter, Past week.', patch: { g_date: 'Past week', g_exp: 'Mid-Senior level', g_salary: '$100,000+' } }
        ];

        function couchQuick(labelText, id, value, isCheck) {
            var box = el('div', {});
            if (isCheck) {
                var line = el('div', { 'class': 'checkline' });
                var cb = el('input', { type: 'checkbox', id: id });
                if (value === true) cb.checked = true;
                line.appendChild(cb);
                line.appendChild(el('label', { for: id, text: labelText }));
                box.appendChild(line);
                return { box: box, input: cb };
            }
            box.appendChild(el('label', { for: id, text: labelText }));
            var input = el('input', { type: 'text', id: id });
            input.value = value;
            box.appendChild(input);
            return { box: box, input: input };
        }

        function buildGamesPanel() {
            var panel = el('div', { 'class': 'panel couch' });
            panel.dataset.tab = 'Games';

            panel.appendChild(el('h2', { text: 'Pick your game' }));
            panel.appendChild(el('p', { 'class': 'couch-sub', text: 'Choose how Lazii-Bot hunts. A card pre-fills the quick settings below - fine-tune anything, then save.' }));

            var cards = el('div', { 'class': 'couch-cards' });
            GAMES.forEach(function (g) {
                var card = el('div', { 'class': 'couch-card', role: 'button', tabindex: '0' });
                card.appendChild(el('h3', { text: g.title }));
                card.appendChild(el('p', { text: g.desc }));
                card.addEventListener('click', function () {
                    document.querySelectorAll('.couch-card').forEach(function (c) { c.classList.remove('picked'); });
                    card.classList.add('picked');
                    Object.keys(g.patch).forEach(function (id) {
                        var node = document.getElementById(id);
                        if (!node) return;
                        if (node.type === 'checkbox') node.checked = g.patch[id] === true;
                        else if (node.tagName === 'SELECT') {
                            for (var i = 0; i < node.options.length; i++) {
                                if (node.options[i].value === g.patch[id]) { node.selectedIndex = i; break; }
                            }
                        }
                        else node.value = g.patch[id] || '';
                    });
                });
                cards.appendChild(card);
            });
            panel.appendChild(cards);

            var quick = el('div', { 'class': 'couch-quick' });
            quick.appendChild(el('h2', { text: 'Quick settings' }));

            var qTitles = couchQuick('Job titles (comma separated)', 'g_titles',
                Array.isArray(currentValue('search', 'search_terms')) ? currentValue('search', 'search_terms').join(', ') : asText(currentValue('search', 'search_terms')));
            var qLocation = couchQuick('Location', 'g_location', asText(currentValue('search', 'search_location')));
            quick.appendChild(qTitles.box);
            quick.appendChild(qLocation.box);

            var qEasy = couchQuick('Easy Apply only', 'g_easy', currentValue('search', 'easy_apply_only') !== false, true);
            quick.appendChild(qEasy.box);

            var qDate = el('div', {});
            qDate.appendChild(el('label', { for: 'g_date', text: 'Date posted' }));
            var dateSel = el('select', { id: 'g_date' });
            ['', 'Any time', 'Past month', 'Past week', 'Past 24 hours'].forEach(function (opt) {
                var o = el('option', { value: opt, text: opt === '' ? '(no filter)' : opt });
                if (asText(currentValue('search', 'date_posted')) === opt) o.selected = true;
                dateSel.appendChild(o);
            });
            qDate.appendChild(dateSel);
            quick.appendChild(qDate);

            var qOnsite = couchQuick('On-site / Remote / Hybrid (comma separated)', 'g_onsite',
                Array.isArray(currentValue('search', 'on_site')) ? currentValue('search', 'on_site').join(', ') : '');
            var qExp = couchQuick('Experience level (comma separated)', 'g_exp',

            function saveQuick(thenStart) {

        // ---- Scout tab (multi-board job discovery) ----

        var TAB_ICONS = {

        };

        // Put an icon in front of every tab label, whatever built the tab.
        function decorateTabs() {
            document.querySelectorAll('#tabs button').forEach(function (btn) {
                if (btn.querySelector('svg')) return;
                var name = btn.dataset.tab || '';
                var span = el('span', { text: btn.textContent });

                btn.appendChild(span);

        // ---- saved-jobs board (Scout -> Pipeline) ----
        var PIPE_STAGES = [
            { key: 'saved',     label: 'Saved',     color: '#ffb457' },
            { key: 'shortlist', label: 'Shortlist', color: '#a78bfa' },
            { key: 'applied',   label: 'Applied',   color: '#6fa8ff' },
            { key: 'interview', label: 'Interview', color: '#48e0a0' },
            { key: 'offer',     label: 'Offer',     color: '#ffd76a' },
            { key: 'closed',    label: 'Closed',    color: '#8595ad' }
        ];
        var SAVED_KEYS = {};    // job key -> true, so Scout can mark rows already saved
        var APPLIED_KEYS = {};  // "title|company" -> true, from the applied history

        function jobKey(job) {
            var url = (job.job_url || job.url || '').trim();
            if (url) return url.toLowerCase();
            return [job.title, job.company, job.location].map(function (v) {
                return String(v == null ? '' : v).trim().toLowerCase();
            }).join('|');
        }

        // JobSpy hands back min_amount/max_amount/interval - fold that into one
        // short string like "$95k-$120k / yearly".
        function payText(job) {
            if (job.salary) return String(job.salary);
            var num = function (v) {
                v = Number(v);
                if (!v || v !== v) return '';
                return v >= 1000 ? '$' + Math.round(v / 1000) + 'k' : '$' + Math.round(v);
            };
            var a = num(job.min_amount), b = num(job.max_amount);
            if (!a && !b) return '';
            var span = (a && b && a !== b) ? a + '-' + b : (a || b);
            return job.interval ? span + ' / ' + job.interval : span;
        }

        // Cross-board duplicate check. Boards give the same posting different
        // URLs, so title+company is the only handle we have; treat a hit as a
        // warning, not a verdict.
        function appliedKey(job) {
            var title = String(job.title == null ? '' : job.title).trim().toLowerCase();
            var company = String(job.company == null ? '' : job.company).trim().toLowerCase();
            return (title && company) ? title + '|' + company : '';
        }

        // Pull the board into memory without rendering it, so Scout can mark
        // saved and already-applied rows on a first visit.
        function primeSavedKeys() {
            return fetch('/api/saved').then(function (r) { return r.json(); }).then(function (data) {
                SAVED_KEYS = {};
                (data.jobs || []).forEach(function (j) { SAVED_KEYS[jobKey(j)] = true; });
                APPLIED_KEYS = {};
                (data.applied_keys || []).forEach(function (k) { APPLIED_KEYS[k] = true; });
            }).catch(function () { /* board is a bonus; never block the panel */ });
        }

        function saveJobs(jobs) {
            return fetch('/api/saved', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jobs: jobs })
            }).then(function (r) { return r.json(); }).then(function (body) {
                jobs.forEach(function (j) { SAVED_KEYS[jobKey(j)] = true; });
                return body;
            });
        }

        function buildPipelinePanel() {
            var panel = el('div', { 'class': 'panel couch' });
            panel.dataset.tab = 'Pipeline';

            var banner = el('div', { 'class': 'couch-banner' });
            banner.appendChild(el('h2', { text: 'Pipeline' }));
            banner.appendChild(el('p', { text: 'Every job you keep from Scout - Indeed, ZipRecruiter, Glassdoor, LinkedIn, Google - lands here. Move a card along as things progress. Stored in saved_jobs.json on this machine only.' }));
            panel.appendChild(banner);

            var stats = el('div', { 'class': 'couch-stats', id: 'pipeStats' });
            panel.appendChild(stats);

            var actions = el('div', { 'class': 'couch-actions' });
            var refreshBtn = el('button', { 'class': 'couch-btn ghost', type: 'button', text: 'Refresh board' });
            refreshBtn.addEventListener('click', refreshPipeline);
            var msg = el('span', { 'class': 'couch-spin', id: 'pipeMsg' });
            actions.appendChild(refreshBtn);
            actions.appendChild(msg);
            panel.appendChild(actions);

            panel.appendChild(el('div', { 'class': 'pipe-board', id: 'pipeBoard' }));
            return panel;
        }

        function refreshPipeline() {
            var board = document.getElementById('pipeBoard');
            var stats = document.getElementById('pipeStats');
            var msg = document.getElementById('pipeMsg');
            if (!board) return;
            fetch('/api/saved').then(function (r) { return r.json(); }).then(function (data) {
                var jobs = data.jobs || [];
                var counts = data.counts || {};
                SAVED_KEYS = {};
                jobs.forEach(function (j) { SAVED_KEYS[jobKey(j)] = true; });
                APPLIED_KEYS = {};
                (data.applied_keys || []).forEach(function (k) { APPLIED_KEYS[k] = true; });

                stats.innerHTML = '';
                [
                    ['Saved total', jobs.length],
                    ['Applied', counts.applied || 0],
                    ['Interviewing', counts.interview || 0],
                    ['Offers', counts.offer || 0]
                ].forEach(function (pair) {
                    var tile = el('div', { 'class': 'couch-stat' });
                    tile.appendChild(el('div', { 'class': 'val', text: String(pair[1]) }));
                    tile.appendChild(el('div', { 'class': 'lab', text: pair[0] }));
                    stats.appendChild(tile);
                });

                board.innerHTML = '';
                PIPE_STAGES.forEach(function (stage) {
                    var col = el('div', { 'class': 'pipe-col' });
                    var head = el('h3');
                    var sw = el('span', { 'class': 'swatch' });
                    sw.style.background = stage.color;
                    head.appendChild(sw);
                    head.appendChild(document.createTextNode(stage.label));
                    var mine = jobs.filter(function (j) { return (j.stage || 'saved') === stage.key; });
                    head.appendChild(el('span', { 'class': 'cnt', text: String(mine.length) }));
                    col.appendChild(head);
                    if (!mine.length) {
                        col.appendChild(el('div', { 'class': 'pipe-empty', text: 'nothing here yet' }));
                    }
                    mine.forEach(function (job) { col.appendChild(pipeCard(job, stage.color)); });
                    board.appendChild(col);
                });
                if (msg) {
                    msg.className = 'couch-spin';
                    msg.textContent = jobs.length ? '' : 'Nothing saved yet - go scout some boards.';
                }
            }).catch(function (err) {
                if (msg) { msg.className = 'couch-msg bad'; msg.textContent = 'Could not load the board: ' + err; }
            });
        }

        function pipeCard(job, color) {
            var card = el('div', { 'class': 'pipe-card' });
            card.style.borderLeftColor = color;

            if (job.job_url) {
                var link = el('a', { href: job.job_url, target: '_blank', rel: 'noopener' });
                link.style.textDecoration = 'none';
                link.appendChild(el('h4', { text: asText(job.title) || 'Untitled role' }));
                card.appendChild(link);
            } else {
                card.appendChild(el('h4', { text: asText(job.title) || 'Untitled role' }));
            }
            card.appendChild(el('div', { 'class': 'co', text: asText(job.company) }));

            var meta = el('div', { 'class': 'meta' });
            var site = asText(job.site).toLowerCase();
            if (site) meta.appendChild(el('span', { 'class': 'src-tag ' + site.replace(/[^a-z]/g, ''), text: site }));
            if (job.location) meta.appendChild(el('span', { text: asText(job.location) }));
            if (job.salary) meta.appendChild(el('span', { text: asText(job.salary) }));
            card.appendChild(meta);

            var row = el('div', { 'class': 'row' });
            var sel = el('select');
            PIPE_STAGES.forEach(function (st) {
                var opt = el('option', { value: st.key, text: st.label });
                if ((job.stage || 'saved') === st.key) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.addEventListener('change', function () {
                fetch('/api/saved', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: job.id, stage: sel.value })
                }).then(refreshPipeline);
            });
            row.appendChild(sel);

            var del = el('button', { 'class': 'mini del', type: 'button', text: 'Remove' });
            del.addEventListener('click', function () {
                fetch('/api/saved', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: job.id })
                }).then(refreshPipeline);
            });
            row.appendChild(del);
            card.appendChild(row);

            // AI resume tailoring: rewrites the active resume for this one job
            // and drops it into "all resumes" (pick it up in the Games tab).
            var tailorRow = el('div', { 'class': 'row' });
            var tailorBtn = el('button', { 'class': 'mini', type: 'button', text: 'Tailor resume' });
            var tailorMsg = el('span', { 'class': 'couch-spin', style: 'font-size:11px;' });
            tailorBtn.addEventListener('click', function () {
                tailorBtn.disabled = true;
                tailorMsg.className = 'couch-spin';
                tailorMsg.textContent = 'Tailoring... can take up to a minute.';
                fetch('/api/resumes/tailor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: job.id })
                })
                    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
                    .then(function (res) {
                        tailorBtn.disabled = false;
                        if (!res.ok) {
                            tailorMsg.className = 'couch-msg bad';
                            tailorMsg.textContent = res.body.error || 'Tailoring failed.';
                            return;
                        }
                        var name = res.body.resume_path.split('/').pop();
                        tailorMsg.className = 'couch-msg';
                        tailorMsg.textContent = 'Saved as ' + name + ' - pick it in Games.';
                    })
                    .catch(function (err) {
                        tailorBtn.disabled = false;
                        tailorMsg.className = 'couch-msg bad';
                        tailorMsg.textContent = 'Tailoring failed: ' + err;
                    });
            });
            tailorRow.appendChild(tailorBtn);
            tailorRow.appendChild(tailorMsg);
            card.appendChild(tailorRow);

            // Notes: collapsed to a one-line summary until clicked, so a column
            // of cards stays scannable.
            var noteWrap = el('div', { 'class': 'note-wrap' });
            var noteText = asText(job.notes);
            var toggle = el('button', { 'class': 'mini note-toggle', type: 'button',
                text: noteText ? 'Note: ' + noteText.slice(0, 28) + (noteText.length > 28 ? '...' : '')
                               : 'Add note' });
            if (noteText) toggle.classList.add('has-note');
            var area = el('textarea', { 'class': 'note-area', rows: '3',
                placeholder: 'Recruiter, interview date, what they asked...' });
            area.value = noteText;
            area.style.display = 'none';

            toggle.addEventListener('click', function () {
                var open = area.style.display !== 'none';
                area.style.display = open ? 'none' : 'block';
                if (!open) area.focus();
            });
            area.addEventListener('blur', function () {
                if (area.value === noteText) return;
                noteText = area.value;
                fetch('/api/saved', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: job.id, notes: noteText })
                }).then(function () { refreshPipeline(); });
            });
            noteWrap.appendChild(toggle);
            noteWrap.appendChild(area);
            card.appendChild(noteWrap);
            return card;
        }

            scoutBtn.addEventListener('click', function () {

                var location = document.getElementById('s_location').value.trim();

                    + '&boards=' + encodeURIComponent(boards.join(','))
                    + '&hours=' + document.getElementById('s_hours').value
                    + '&limit=' + document.getElementById('s_limit').value)
                    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
