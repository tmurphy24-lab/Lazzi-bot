                            return;
                        }
                        var table = el('table', { 'class': 'jobs' });
                        var thead = el('thead');
                        var hr = el('tr');
                        ['Title', 'Company', 'Location', 'Pay', 'Posted', 'Source', 'Link', 'Keep'].forEach(function (h) { hr.appendChild(el('th', { text: h })); });
                        thead.appendChild(hr);
                        table.appendChild(thead);
                        var tbody = el('tbody');
                        jobs.forEach(function (j) {
                            j.salary = payText(j);
                            j.site = Array.isArray(j.site) ? j.site.join(',') : asText(j.site);
                            var tr = el('tr');
                            tr.appendChild(el('td', { text: asText(j.title) }));
                            tr.appendChild(el('td', { text: asText(j.company) }));
                            tr.appendChild(el('td', { text: asText(j.location) }));
                            tr.appendChild(el('td', { text: j.salary || '-' }));
                            tr.appendChild(el('td', { text: asText(j.date_posted).slice(0, 10) }));
                            var srcCell = el('td');
                            srcCell.appendChild(el('span', { 'class': 'src-tag ' + j.site.toLowerCase().replace(/[^a-z]/g, ''), text: j.site }));
                            tr.appendChild(srcCell);
                            var linkCell = el('td');
                            if (j.job_url) linkCell.appendChild(el('a', { href: asText(j.job_url), target: '_blank', rel: 'noopener', text: 'Open' }));
                            else linkCell.textContent = 'N/A';
                            tr.appendChild(linkCell);

                            var keepCell = el('td');
                            if (APPLIED_KEYS[appliedKey(j)]) {
                                keepCell.appendChild(el('span', { 'class': 'dupe-tag',
                                    title: 'A job with this title and company is already in your applied history',
                                    text: 'Applied' }));
                            }
                            var keep = el('button', { 'class': 'savebtn', type: 'button' });
                            var already = !!SAVED_KEYS[jobKey(j)];
                            keep.textContent = already ? 'Saved' : 'Save';
                            if (already) { keep.classList.add('done'); keep.disabled = true; }
                            keep.addEventListener('click', function () {
                                keep.disabled = true;
                                saveJobs([j]).then(function () {
                                    keep.textContent = 'Saved';
                                    keep.classList.add('done');
                                }).catch(function () {
                                    keep.disabled = false;
                                    keep.textContent = 'Retry';
                                });
                            });
                            keepCell.appendChild(keep);
                            tr.appendChild(keepCell);
                            tbody.appendChild(tr);
                        });
                        table.appendChild(tbody);

                        var bulk = el('div', { 'class': 'couch-actions' });
                        var saveAll = el('button', { 'class': 'couch-btn ghost', type: 'button',
                            text: 'Save all ' + jobs.length + ' to Pipeline' });
                        saveAll.addEventListener('click', function () {
                            saveAll.disabled = true;
                            saveAll.textContent = 'Saving...';
                            saveJobs(jobs).then(function (body) {
                                saveAll.textContent = 'Saved ' + (body.added || 0) + ' new';
                                holder.querySelectorAll('.savebtn').forEach(function (b) {
                                    b.textContent = 'Saved'; b.classList.add('done'); b.disabled = true;
                                });
                            }).catch(function () {
                                saveAll.disabled = false;
                                saveAll.textContent = 'Save failed - retry';
                            });
                        });
                        bulk.appendChild(saveAll);
                        bulk.appendChild(el('span', { 'class': 'couch-spin',
                            text: 'Saved jobs live on the Pipeline tab.' }));
                        holder.appendChild(bulk);
                        holder.appendChild(table);
                        msg.textContent = jobs.length + ' listings found.';
                    })
                    .catch(function (err) {
                        scoutBtn.disabled = false;
                        msg.textContent = '';
                        holder.innerHTML = '';
                        holder.appendChild(el('p', { 'class': 'couch-msg bad', text: 'Scout failed: ' + err }));
                    });
            });
            return panel;
        }

        // ---- Stats tab (application analytics) ----
        function buildStatsPanel() {
            var panel = el('div', { 'class': 'panel couch' });
            panel.dataset.tab = 'Stats';
            panel.id = 'statsPanel';

            panel.appendChild(el('h2', { text: 'Stats' }));
            panel.appendChild(el('p', { 'class': 'couch-sub', text: 'What the hunt has produced so far. Fed from the applied/failed history CSVs.' }));
            panel.appendChild(el('div', { id: 'statsBody' }));
            panel.appendChild(el('p', { 'class': 'couch-foot', text: 'Raw data: all excels/all_applied_applications_history.csv and all_failed_applications_history.csv' }));
            return panel;
        }

        function refreshStats() {
            var body = document.getElementById('statsBody');
            if (!body) return;
            fetch('/api/stats').then(function (r) { return r.json(); }).then(function (s) {
                body.innerHTML = '';
                var total = s.total_applied || 0;
                var failed = s.total_failed || 0;
                var days = s.day_counts || {};
                var weekAgo = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
                var last7 = 0;
                Object.keys(days).forEach(function (k) { if (k >= weekAgo) last7 += days[k]; });

                var cards = el('div', { 'class': 'couch-stats' });
                [['Total applied', String(total)], ['Failed', String(failed)], ['Last 7 days', String(last7)],
                 ['Companies', String((s.top_companies || []).length)]].forEach(function (pair) {
                    var card = el('div', { 'class': 'couch-stat' });
                    card.appendChild(el('div', { 'class': 'val', text: pair[1] }));
                    card.appendChild(el('div', { 'class': 'lab', text: pair[0] }));
                    cards.appendChild(card);
                });
                body.appendChild(cards);

                var wrap = el('div', { 'class': 'couch-bars-wrap' });
                wrap.appendChild(el('h2', { text: 'Applications per day (last 14 days)' }));
                var bars = el('div', { 'class': 'couch-bars' });
                var keys = Object.keys(days).slice(-14);
                var maxVal = 1;
                keys.forEach(function (k) { if (days[k] > maxVal) maxVal = days[k]; });
                if (!keys.length) {
                    bars.appendChild(el('p', { 'class': 'couch-spin', text: 'No dated applications yet - they show up here after your first run.' }));
                } else {
                    keys.forEach(function (k) {
                        var bar = el('div', { 'class': 'bar' });
                        bar.style.height = Math.max(4, Math.round(days[k] / maxVal * 100)) + '%';
                        bar.appendChild(el('span', { text: k.slice(5) + ' (' + days[k] + ')' }));
                        bars.appendChild(bar);
                    });
                }
                wrap.appendChild(bars);
                body.appendChild(wrap);

                body.appendChild(el('h2', { text: 'Top companies' }));
                if (!(s.top_companies || []).length) {
                    body.appendChild(el('p', { 'class': 'couch-spin', text: 'Nothing yet.' }));
                } else {
                    var list = el('div', { 'class': 'couch-quick' });
                    s.top_companies.forEach(function (pair) {
                        var line = el('div', {});
                        line.textContent = pair[0] + ' - ' + pair[1] + (pair[1] === 1 ? ' application' : ' applications');
                        list.appendChild(line);
                    });
                    body.appendChild(list);
                }
            }).catch(function () {
                body.innerHTML = '';
                body.appendChild(el('p', { 'class': 'couch-msg bad', text: 'Could not load stats.' }));
            });
        }

        function buildGuidePanel() {
            var panel = el('div', { 'class': 'panel couch' });
            panel.dataset.tab = 'Guide';

            var banner = el('div', { 'class': 'couch-banner' });
            banner.appendChild(el('h2', { text: 'Welcome 2 The Couch' }));
            banner.appendChild(el('p', { text: 'This is the command center. You put your info in, Lazii-Bot does the rest: hunts listings, answers questions, uploads your resume and logs every application. First time here? Walk the steps below - top to bottom - and you are done.' }));
            panel.appendChild(banner);

            var steps = [
                ['Account', "Drop your LinkedIn email + password here so runs can log in on their own. Turn on 'Use AI' and add an API key (or point at Ollama) to unlock tailored resumes and Lazii-Bot's chat brain. Your keys stay on this machine."],
                ['Profile', 'Your name, phone, address and the equal-opportunity answers applications ask for. Fill these once; every application reuses them.'],
                ['Games', 'Pick a game card and quick settings to define the hunt: titles, location, remote or not, freshness. This is the fun way to fill the Search tab.'],
                ['Resume', 'Drop resume PDFs into the "all resumes" folder in the project, then pick the active one in Games (or chat: "switch to my resume X"). Missing one? LinkedIn reuses your last upload.'],
                ['Scout', 'Hunt multiple boards without logging into anything: the built-in JobSpy scraper pulls Indeed, ZipRecruiter, Glassdoor, LinkedIn and Google Jobs and shows fresh listings with pay and links. Hit Save on any row to keep it.'],
                ['Pipeline', 'Your saved-jobs board. Cards move Saved > Shortlist > Applied > Interview > Offer > Closed, so nothing you found on Indeed gets lost. Stored locally in saved_jobs.json.'],
                ['Run', 'Press Start and watch the log. Keep the browser in the foreground for normal runs, or flip Headless in Games for invisible scheduled runs. You can also just tell Lazii-Bot in chat: "start hunting" or "stop".'],
                ['Track', 'Every application lands in the history table on the Run tab, the Stats tab charts your daily pace, and all excels/all_applied_applications_history.csv holds the raw data.']
            ];
            steps.forEach(function (s, i) {
                var step = el('div', { 'class': 'couch-step' });
                step.appendChild(el('div', { 'class': 'num', text: String(i + 1) }));
                var body = el('div');
                body.appendChild(el('h3', { text: s[0] }));
                body.appendChild(el('p', { text: s[1] }));
                step.appendChild(body);
                panel.appendChild(step);
            });

            var about = el('div', { 'class': 'couch-step' });
            about.appendChild(el('div', { 'class': 'num', text: 'L' }));
            var aboutBody = el('div');
            aboutBody.appendChild(el('h3', { text: 'About Lazii-Bot' }));
            aboutBody.appendChild(el('p', { text: 'Chubby, scruffy, permanently horizontal. He lives in the bubble at the bottom-right of every page, talks to your AI, and changes settings when you ask. Roadmap: chat-controlled runs, more job boards, weekly summaries. Monetization later: free local couch forever; paid extras (cloud key hosting, multi-board packs, priority AI models) only if you want them - the couch itself stays free.' }));
            about.appendChild(aboutBody);
            panel.appendChild(about);

            var how = el('div', { 'class': 'couch-step' });
            how.appendChild(el('div', { 'class': 'num', text: '?' }));
            var howBody = el('div');
            howBody.appendChild(el('h3', { text: 'What scrapes, and what applies' }));
            howBody.appendChild(el('p', { text: 'Two different engines. The scraper is JobSpy, built in and running inside this app (Scout tab) - it reads Indeed, ZipRecruiter, Glassdoor, LinkedIn and Google Jobs with no login. The auto-apply bot is a Selenium browser driving LinkedIn Easy Apply only; no other board has a hands-off apply flow, so for saved Indeed or ZipRecruiter jobs you open the link and apply yourself while the Pipeline board tracks where each one stands.' }));
            how.appendChild(howBody);
            panel.appendChild(how);

            var sched = el('div', { 'class': 'couch-step' });
            sched.appendChild(el('div', { 'class': 'num', text: 'S' }));
            var schedBody = el('div');
            schedBody.appendChild(el('h3', { text: 'Scheduled agent' }));
            schedBody.appendChild(el('p', { text: 'A Windows scheduled task (LinkedInJobBotDaily) starts the bot every day at 09:37 in headless mode. It reads credentials from environment variables or a .env file in the project root - never from git-tracked files.' }));
            sched.appendChild(schedBody);
            panel.appendChild(sched);

            return panel;
        }

        function setRunningUI(running, pid) {
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            var startBtn = document.getElementById('startBtn');
            var stopBtn = document.getElementById('stopBtn');
            if (!dot) return;
            var hdr = document.getElementById('hdrStatus');
            if (running) {
                dot.classList.add('on');
                if (hdr) { hdr.textContent = 'Hunting'; hdr.className = 'badge live'; }
                text.textContent = 'Running' + (pid ? ' (process ' + pid + ')' : '') + '...';
                if (startBtn) startBtn.disabled = true;
                if (stopBtn) stopBtn.disabled = false;
            } else {
                dot.classList.remove('on');
                if (hdr) { hdr.textContent = 'Idle'; hdr.className = 'badge'; }
                text.textContent = 'Not running';
                if (startBtn) startBtn.disabled = false;
                if (stopBtn) stopBtn.disabled = true;
            }
        }

        function refreshStatus() {
            fetch('/api/status').then(function (r) { return r.json(); })
                .then(function (s) { setRunningUI(s.running, s.pid); })
                .catch(function () {});
        }

        function refreshLogs() {
            fetch('/api/logs?offset=' + logOffset).then(function (r) { return r.json(); })
                .then(function (data) {
                    if (typeof data.next_offset === 'number' && data.next_offset < logOffset) {
                        // Log was truncated; reset the pane.
                        logOffset = 0;
                        document.getElementById('logPane').textContent = '';
                    }
                    if (data.content) {
                        var pane = document.getElementById('logPane');
                        if (pane.textContent === 'No activity yet.') pane.textContent = '';
                        var atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 20;
                        pane.textContent += data.content;
                        if (atBottom) pane.scrollTop = pane.scrollHeight;
                    }
                    if (typeof data.next_offset === 'number') logOffset = data.next_offset;
                })
                .catch(function () {});
        }

        function startBot() {
            var msgOk = confirm('Start applying now?\n\nA browser window will open and use your LinkedIn account. Keep it in the foreground.');
            if (!msgOk) return;
            var pane = document.getElementById('logPane');
            pane.textContent = '';
            logOffset = 0;
            fetch('/api/run', { method: 'POST' }).then(function (r) { return r.json(); })
                .then(function (s) { setRunningUI(s.running, s.pid); refreshLogs(); })
                .catch(function () {});
        }

        function stopBot() {
            fetch('/api/stop', { method: 'POST' }).then(function (r) { return r.json(); })
                .then(function (s) { setRunningUI(s.running, s.pid); })
                .catch(function () {});
        }

        function pollLoop() {
            if (activeTab === 'Run') { refreshStatus(); refreshLogs(); }
            pollTimer = setTimeout(pollLoop, 1500);
        }

        // ---- applied jobs history ----
        function loadAppliedJobs() {
            var holder = document.getElementById('jobsHolder');
            if (!holder) return;
            fetch('/applied-jobs').then(function (r) {
                if (r.status === 404) return [];
                return r.json();
            }).then(function (jobs) {
                if (!Array.isArray(jobs) || jobs.length === 0) {
                    holder.innerHTML = '';
                    holder.appendChild(el('p', { class: 'muted-small', text: 'No applications yet. They will appear here after your first run.' }));
                    return;
                }
                var table = el('table', { class: 'jobs' });
                var thead = el('thead');
                var hr = el('tr');
                ['#', 'Job Title', 'Company', 'HR Contact', 'Link', 'Applied'].forEach(function (h) {
                    hr.appendChild(el('th', { text: h }));
                });
                thead.appendChild(hr);
                table.appendChild(thead);
                var tbody = el('tbody');
                jobs.forEach(function (job, i) {
                    var tr = el('tr');
                    tr.appendChild(el('td', { text: String(i + 1) }));
                    var titleCell = el('td');
                    if (job.Job_Link) {
                        titleCell.appendChild(el('a', { href: job.Job_Link, target: '_blank', rel: 'noopener', text: job.Title || 'View' }));
                    } else { titleCell.textContent = job.Title || ''; }
                    tr.appendChild(titleCell);
                    tr.appendChild(el('td', { text: job.Company || '' }));
                    var hrCell = el('td');
                    if (job.HR_Name && job.HR_Name !== 'Unknown' && job.HR_Link) {
                        hrCell.appendChild(el('a', { href: job.HR_Link, target: '_blank', rel: 'noopener', text: job.HR_Name }));
                    } else { hrCell.textContent = 'N/A'; }
                    tr.appendChild(hrCell);
                    var linkCell = el('td');
                    if (job.External_Job_link === 'Easy Applied') {
                        linkCell.textContent = 'Easy Applied';
                    } else if (job.External_Job_link) {
                        linkCell.appendChild(el('a', { href: job.External_Job_link, target: '_blank', rel: 'noopener', text: 'External' }));
                    } else { linkCell.textContent = 'N/A'; }
                    tr.appendChild(linkCell);
                    var appliedCell = el('td');
                    if (job.External_Job_link === 'Easy Applied' || (job.Date_Applied && job.Date_Applied !== 'Pending')) {
                        appliedCell.innerHTML = '<span class="tick">&#10003;</span>';
                    }
                    tr.appendChild(appliedCell);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                holder.innerHTML = '';
                holder.appendChild(table);
            }).catch(function () {
                holder.innerHTML = '';
                holder.appendChild(el('p', { class: 'muted-small', text: 'Could not load history.' }));
            });
        }

        // ---- save / load config ----
        function readControlValue(field) {
            var node = document.getElementById(fieldId(field));
            if (!node) return undefined;
            if (field.type === 'bool') return node.checked;
            if (field.type === 'list') {
                return node.value.split(',').map(function (s) { return s.trim(); })
                    .filter(function (s) { return s !== ''; });
            }
            if (field.type === 'number') {
                var t = node.value.trim();
                if (t === '') return undefined; // leave unchanged, avoid server error
                var n = Number(t);
                return isNaN(n) ? undefined : n;
            }
            return node.value;
        }

        function baselineValue(cm, key) {
            if (BASELINE[cm] && Object.prototype.hasOwnProperty.call(BASELINE[cm], key)) {
                return BASELINE[cm][key];
            }
            return undefined;
        }

        function saveConfig() {
            var payload = {};
            var changed = 0;
            SCHEMA.forEach(function (section) {
                section.fields.forEach(function (field) {
                    var current = readControlValue(field);
                    if (current === undefined) return;
                    var base = baselineValue(field.config_module, field.key);
                    if (JSON.stringify(current) !== JSON.stringify(base)) {
                        if (!payload[field.config_module]) payload[field.config_module] = {};
                        payload[field.config_module][field.key] = current;
                        changed++;
                    }
                });
            });

            var msg = document.getElementById('saveMsg');
            if (changed === 0) {
                msg.className = 'msg';
                msg.textContent = 'Nothing to save - no changes yet.';
                return;
            }
            var btn = document.getElementById('saveBtn');
            btn.disabled = true;
            msg.className = 'msg';
            msg.textContent = 'Saving...';
            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) {
                return r.json().then(function (body) { return { ok: r.ok, body: body }; });
            }).then(function (res) {
                btn.disabled = false;
                if (!res.ok) {
                    msg.className = 'msg err';
                    msg.textContent = 'Could not save: ' + (res.body && res.body.error ? res.body.error : 'unknown error');
                    return;
                }
                CONFIG = mergeIntoConfig(res.body);
                BASELINE = JSON.parse(JSON.stringify(CONFIG));
                msg.className = 'msg ok';
                msg.textContent = 'Saved ' + changed + (changed === 1 ? ' change.' : ' changes.');
            }).catch(function (err) {
                btn.disabled = false;
                msg.className = 'msg err';
                msg.textContent = 'Could not save: ' + err;
            });
        }

        function mergeIntoConfig(saved) {
            // saved is the full user_config.json. Overlay it onto the effective CONFIG.
            var merged = JSON.parse(JSON.stringify(CONFIG));
            for (var cm in saved) {
                if (!merged[cm]) merged[cm] = {};
                for (var key in saved[cm]) { merged[cm][key] = saved[cm][key]; }
            }
            return merged;
        }

        function loadAll() {
            Promise.all([
                fetch('/api/schema').then(function (r) { return r.json(); }),
                fetch('/api/config').then(function (r) { return r.json(); }),
                primeSavedKeys()
            ]).then(function (results) {
                SCHEMA = results[0];
                CONFIG = results[1] || {};
                BASELINE = JSON.parse(JSON.stringify(CONFIG));
                buildTabs();
            }).catch(function (err) {
                document.getElementById('panels').innerHTML =
                    '<p style="color:#dc2626">Could not load settings from the app. Is it still running? (' + err + ')</p>';
            });
        }

        document.getElementById('saveBtn').addEventListener('click', saveConfig);
        document.getElementById('reloadBtn').addEventListener('click', function () {
            document.getElementById('saveMsg').textContent = 'Reloading saved settings...';
            loadAll();
        });

        // Lazii-Bot changed settings via chat - re-render everything from the saved config.
        window.addEventListener('lazii:config-changed', function () { loadAll(); });

        loadAll();
        pollLoop();
    </script>
